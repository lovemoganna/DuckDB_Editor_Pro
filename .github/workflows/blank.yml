name: CI

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repository hygiene and ignore audit
        run: pnpm audit:gitignore
      - name: Production dependency audit
        run: pnpm audit --prod
      - name: Type check
        run: pnpm typecheck
      - name: Prepare private real-data acceptance baseline
        env:
          DASHBOARD_BASELINE_BASE64: ${{ secrets.DASHBOARD_BASELINE_BASE64 }}
        run: node scripts/prepare-dashboard-baseline.mjs
      - name: Unit and integration tests
        run: pnpm test:run
      - name: Install browser for dashboard regression
        run: pnpm exec playwright install --with-deps chromium
      - name: Real-data dashboard browser regression
        run: pnpm test:dashboard:browser
      - name: Formal home browser regression
        run: pnpm test:home:browser
      - name: Dashboard acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-evidence
          path: |
            output/playwright/dashboard-stability/
            output/playwright/home-governance/
      - name: Production build
        run: pnpm build
      - name: Store verified production build
        uses: actions/upload-artifact@v4
        with:
          name: verified-production-build
          path: dist/
          if-no-files-found: error
