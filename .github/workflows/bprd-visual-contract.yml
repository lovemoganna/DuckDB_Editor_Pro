name: BPRD Visualization Contract Test
on:
  push:
    branches:
      - test/bprd-visual-contract-20261015
  pull_request:
    paths:
      - 'utils/chartUtils.ts'
      - 'utils/chartUtils.test.ts'
      - 'components/DashboardWidget.tsx'
      - 'components/DashboardWidget.visualContract.test.tsx'
      - '.github/workflows/bprd-visual-contract.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Targeted regression (expected RED before patch)
        run: pnpm exec vitest run utils/chartUtils.test.ts components/DashboardWidget.visualContract.test.tsx --pool=threads --maxWorkers=1 --no-file-parallelism
      - name: TypeScript
        run: pnpm typecheck
      - name: Full test suite
        run: pnpm test:run
      - name: Production build
        run: pnpm build
